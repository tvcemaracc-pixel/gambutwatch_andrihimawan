<!DOCTYPE html>
<!-- saved from url=(0048)file:///C:/Users/ACER/Downloads/index%20(3).html -->
<html lang="id"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GambutWatch — Monitoring Gambut</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f2;color:#17321f}
header{background:#174d2a;color:white;padding:18px 22px;position:sticky;top:0;z-index:2}
header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:8px;padding:12px;max-width:1100px;margin:auto}
nav button{border:0;border-radius:10px;padding:11px 15px;background:white;color:#174d2a;font-weight:bold;cursor:pointer}
nav button.active{background:#174d2a;color:white}
main{max-width:1100px;margin:auto;padding:8px 12px 40px}.page{display:none}.page.active{display:block}
.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
h2{margin:4px 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5ddd6;border-radius:10px;font-size:15px;background:#fff}
textarea{min-height:80px}.full{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{background:#174d2a;color:white}.secondary{background:#e6efe8;color:#174d2a}.danger{background:#b72e2e;color:white}
.photo{border:2px dashed #b8c8ba;border-radius:12px;padding:18px;text-align:center}
#preview{max-width:100%;max-height:260px;border-radius:12px;margin-top:10px;display:none}
.status{padding:14px;border-radius:12px;font-weight:bold;text-align:center;font-size:18px}.safe{background:#dff2df;color:#1c6b28}.warn{background:#fff0bd;color:#805c00}.critical{background:#ffd9d9;color:#a01818}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:14px;background:white;text-align:center}.stat b{display:block;font-size:25px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e5eae5;text-align:left;vertical-align:top}th{background:#f0f5f0}
.badge{padding:5px 8px;border-radius:20px;font-weight:bold;font-size:11px}.b-safe{background:#dff2df}.b-warn{background:#fff0bd}.b-critical{background:#ffd9d9}
small{color:#66776a}.empty{text-align:center;padding:30px;color:#77847a}
@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header><h1>🌿 GambutWatch</h1><p>Prototype monitoring gambut berbasis HP / komputer</p></header>
<nav>
<button class="active" onclick="showPage('input',this)">📋 Input Laporan</button>
<button onclick="showPage('dash',this)" class="">📊 Dashboard</button>
</nav>
<main>
<section id="input" class="page active">
<div class="card">
<h2>Monitoring Gambut</h2>
<div class="grid">
<div><label>ID Laporan</label><input id="rid" readonly=""></div>
<div><label>Lokasi</label><input id="loc" placeholder="Contoh: Rasau Jaya"></div>
<div><label>GPS</label><input id="gps" placeholder="Belum diambil" readonly=""></div>
<div><label>Waktu</label><input id="time" readonly=""></div>
<div class="full photo">
<label>📷 Dokumentasi Foto — 4 foto wajib</label>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
<div><label>Foto 1 — Papan Ukur MAT</label><input id="photo1" type="file" accept="image/*" capture="environment"><img id="preview1" style="max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none"></div>
<div><label>Foto 2 — Arah Utara</label><input id="photo2" type="file" accept="image/*" capture="environment"><img id="preview2" style="max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none"></div>
<div><label>Foto 3 — Arah Selatan</label><input id="photo3" type="file" accept="image/*" capture="environment"><img id="preview3" style="max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none"></div>
<div><label>Foto 4 — Kondisi Gambut</label><input id="photo4" type="file" accept="image/*" capture="environment"><img id="preview4" style="max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none"></div>
</div>
<small>Di HP, setiap kolom dapat membuka kamera.</small>
</div>
<div><div><label>🌡️ Suhu (°C)</label><input id="temp" type="number" step="0.1" value="34"></div></div>
<div><div><label>💧 Tinggi Muka Air (cm)</label><input id="water" type="number" step="1" value="-55"></div></div>
<div><div><label>📝 Kondisi Gambut</label><select id="condition"><option>Basah</option><option>Lembap</option><option selected="">Kering</option><option>Sangat Kering</option></select></div></div>
<div><div><label>🔥 Asap</label><select id="smoke"><option>Tidak</option><option selected="">Ada</option></select></div></div>
<div><div><label>🔥 Api</label><select id="fire"><option selected="">Tidak</option><option>Ada</option></select></div></div>
<div class="full"><label>Catatan</label><textarea id="notes" placeholder="Keterangan kondisi lapangan..."></textarea></div>
</div>
<div class="row" style="margin-top:14px">
<button class="btn secondary" onclick="getGPS()">📍 Ambil GPS</button>
<button class="btn secondary" onclick="setTime()">🕐 Waktu Sekarang</button>
<button class="btn primary" onclick="saveReport()">💾 Simpan Laporan</button>
</div>
<div id="statusBox" class="status warn" style="margin-top:14px">🟡 WASPADA</div>
<small>Status dihitung otomatis berdasarkan kondisi yang dimasukkan.</small>
</div>
</section>

<section id="dash" class="page">
<div class="stats">
<div class="stat">🟢<b id="safeN">0</b><small>Aman</small></div>
<div class="stat">🟡<b id="warnN">0</b><small>Waspada</small></div>
<div class="stat">🔴<b id="criticalN">0</b><small>Darurat</small></div>
</div>
<div class="card">
<h2>Daftar Laporan</h2>
<div id="reports"><div class="empty">Belum ada laporan.</div></div>
<div class="row" style="margin-top:12px"><button class="btn secondary" onclick="exportCSV()">⬇️ Export CSV</button><button class="btn danger" onclick="clearReports()">Hapus Semua Data</button></div>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function setTime(){$('time').value=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});}
function newId(){const d=new Date(),p=n=>String(n).padStart(2,'0');return 'GBT-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
$('rid').value=newId(); setTime();
function getGPS(){
 if(!navigator.geolocation){alert('Browser tidak mendukung GPS.');return}
 navigator.geolocation.getCurrentPosition(p=>{$('gps').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},e=>alert('GPS tidak tersedia/izin belum diberikan: '+e.message),{enableHighAccuracy:true,timeout:10000});
}
[1,2,3,4].forEach(n=>$('photo'+n).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview'+n).src=r.result;$('preview'+n).style.display='block';$('photo'+n).dataset.data=r.result};r.readAsDataURL(f);});
['temp','water','condition','smoke','fire'].forEach(id=>$(id).addEventListener('input',calcStatus));
function calcStatus(){
 let fire=$('fire').value==='Ada', smoke=$('smoke').value==='Ada', c=$('condition').value, w=parseFloat($('water').value);
 let s=fire?'critical':(smoke||c==='Sangat Kering'||(!isNaN(w)&&w<=-60))?'warn':(c==='Kering'||(!isNaN(w)&&w<=-40))?'warn':'safe';
 let box=$('statusBox');box.className='status '+s;box.textContent=s==='critical'?'🔴 DARURAT':s==='warn'?'🟡 WASPADA':'🟢 AMAN';return s;
}
function getReports(){return JSON.parse(localStorage.getItem('gambutReports')||'[]')}
function saveReport(){
 const photos=[1,2,3,4].map(n=>$('photo'+n).dataset.data||'');
 const required=['loc','gps','temp','water','condition','smoke','fire'];
 if(required.some(id=>!$(id).value.trim())||photos.some(p=>!p)){alert('Lengkapi lokasi, GPS, suhu, muka air, kondisi, asap, api, dan 4 foto.');return;}
 const status=calcStatus();
 const r={id:$('rid').value,loc:$('loc').value,gps:$('gps').value,time:$('time').value,
 temp:$('temp').value,water:$('water').value,condition:$('condition').value,smoke:$('smoke').value,fire:$('fire').value,status,notes:$('notes').value,photos};
 const arr=getReports();arr.unshift(r);
 try{localStorage.setItem('gambutReports',JSON.stringify(arr));alert('Laporan tersimpan di perangkat ini.');render();showPage('dash',document.querySelectorAll('nav button')[1]);}
 catch(e){alert('Penyimpanan penuh. Hapus data lama atau gunakan foto berukuran lebih kecil.');}
}
function render(){
 const a=getReports();$('safeN').textContent=a.filter(x=>x.status==='safe').length;$('warnN').textContent=a.filter(x=>x.status==='warn').length;$('criticalN').textContent=a.filter(x=>x.status==='critical').length;
 if(!a.length){$('reports').innerHTML='<div class="empty">Belum ada laporan.</div>';return}
 $('reports').innerHTML='<table><thead><tr><th>ID</th><th>Lokasi/GPS</th><th>Waktu</th><th>Kondisi</th><th>Foto</th><th>Api/Asap</th><th>Status</th></tr></thead><tbody>'+a.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.loc)}<br><small>${esc(r.gps||'-')}</small></td><td>${esc(r.time)}</td><td>${esc(r.condition)}<br>${esc(r.water)} cm · ${esc(r.temp)}°C</td><td>${(r.photos||[]).map(p=>p?`<img src="${p}" style="width:58px;height:44px;object-fit:cover;border-radius:6px;margin:2px">`:``).join("")}</td><td>Asap: ${esc(r.smoke)}<br>Api: ${esc(r.fire)}</td><td><span class="badge ${r.status==='safe'?'b-safe':r.status==='warn'?'b-warn':'b-critical'}">${r.status==='safe'?'🟢 AMAN':r.status==='warn'?'🟡 WASPADA':'🔴 DARURAT'}</span></td></tr>`).join('')+'</tbody></table>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function clearReports(){if(confirm('Hapus semua laporan dari perangkat ini?')){localStorage.removeItem('gambutReports');render()}}
function exportCSV(){
 const a=getReports();if(!a.length){alert('Belum ada data.');return}
 const cols=['id','loc','gps','time','temp','water','condition','smoke','fire','status','notes'];let csv=cols.join(',')+'\\n'+a.map(r=>cols.map(c=>`"${String(r[c]??'').replaceAll('"','""')}"`).join(',')).join('\\n');
 const blob=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='laporan-gambut.csv';x.click();URL.revokeObjectURL(u);
}
calcStatus();render();
</script>
</body></html>
